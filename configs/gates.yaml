# Gate status (spec 18). A real pilot run refuses to start unless G1 and G2 are PASSED, or the
# operator passes --allow-open-gates "<reason>", which is recorded in every run record.
# This file is updated by a human reviewer, never by the harness.
schema_version: "1.0"
gates:
  G1:
    status: PASSED
    description: >-
      Operator sign-off 2026-10-28 on docs/g1_prior_art.md (recommended GO for the
      E1+E2+E3 combination; no occupying study found). Claim restrictions in that
      memo still apply. This is not a proof that no occupying paper exists.
  G2:
    status: OPEN
    description: >-
      Construct pack in docs/g2/ (28 vignettes, rubric, A1 and A2 labels).
      make g2-agreement reports construct κ = 1.000 (MEETS_THRESHOLD numerically).
      A2 applied the rubric without opening A1 but is the project coding assistant,
      not a second independent human, so this gate stays OPEN (D-43). S_sec and
      criticality double-coding (D-10, D-19) remain separate and are not this gate.
  G3:
    status: NOT_EVALUATED
    description: Pilot outcome gate (confirmed ambiguous erosions, contrast, flake < 5%).
  G4:
    status: NOT_EVALUATED
    description: Replay oracle vs simpler baselines (spec 15). A synthetic calibration construct check is recorded in experiments/reports/g4_calibration.md (PROVISIONAL there); that is not a 144-run finding and does not set this gate to PASSED.
