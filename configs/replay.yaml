# Replay oracle configuration. Part of the frozen experiment definition (spec §6.1):
# changing a value here after baselines are recorded requires a new experiment version.
schema_version: "1.0"
experiment_version: "phase1-0.1"

# Minimum valid replays as a percentage of planned k (spec §6.2/§7.1: ceil(0.8*k)).
# The per-attack planned k comes from the attack definition's `replay_count`.
min_valid_percent: 80

# Pilot flake budget (proposal gate G3: "flake rate < 5%"). Flake rate is computed
# as defined in DECISIONS.md D-05; the comparison is strict (rate < limit).
flake_rate_limit: 0.05

# Wall-clock limit per replay subprocess. A timeout makes the replay invalid
# (TIMEOUT); it is never treated as a silent alert.
replay_timeout_seconds: 60

# Attack-level alert aggregation across multiple expected rules (spec §4.4).
# Pre-registered policy: the attack alert fires if ANY expected rule fires.
attack_alert_aggregation: any_expected_rule
