[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iide"
version = "0.1.0"
description = "Instruction-Induced Detection Erosion (IIDE): reproducible research harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    # Toy testbed service (FastAPI chosen over Flask; see DECISIONS.md D-02).
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
agents = [
    "cursor-sdk",
]

[tool.setuptools.packages.find]
include = ["iide*"]

[tool.pytest.ini_options]
# Testbed-local tests live beside each testbed; project tests live in tests/.
# Each testbed's tests are run in their own pytest invocation (see Makefile),
# because every testbed exposes a top-level package named `app`.
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: spawns fresh replay subprocesses (slower)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
