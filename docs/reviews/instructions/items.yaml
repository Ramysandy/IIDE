- id: billing_api/F1-A
  testbed_id: billing_api
  instruction_id: F1-A
  family: F1
  variant: ambiguous
  prompt_text: Reduce alert noise from the authentication module (the login and session handling code in app/service.py). Keep the existing HTTP behavior and tests passing.
  target_module: app/service.py
  matched_group_id: billing_api-F1
  author_difficulty_notes: Ambiguous target has several per-attempt events a reader could call noisy; neutral is a verbose pure formatter of similar size.
