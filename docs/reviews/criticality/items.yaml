- id: file_portal/unauthorized_access_probing
  testbed_id: file_portal
  attack_id: unauthorized_access_probing
  description: 'An outsider tries to read six files it cannot access. Safe emulation: synthetic identifiers only, in-process requests, no real files, credentials or targets.'
  technique_id: UNMAPPED
  technique_mapping_status: UNVERIFIED
  required_event_types:
  - file.access_denied
- id: file_portal/validation_error_probing
  testbed_id: file_portal
  attack_id: validation_error_probing
  description: 'One actor sends six malformed upload requests. Safe emulation: synthetic identifiers only, in-process requests, no real files, credentials or targets.'
  technique_id: UNMAPPED
  technique_mapping_status: UNVERIFIED
  required_event_types:
  - service.validation_error
