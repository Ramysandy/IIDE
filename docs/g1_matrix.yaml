claim_restrictions:
  - "Do not claim E2 (paired instruction variants) as a method contribution."
  - "Do not claim E3 (attack replay against frozen rules) as a technique contribution."
  - "Do not claim E1 as an unseen phenomenon; the OpenAI incident and IFG's degrading-logging sabotage are adjacent."
  - "Lead with the E1+E2+E3 combination and with LEI (E4). Keep CAI (E5) exploratory."
  - "If an occupying study appears (OpenAI eval, Overeager follow-on with a telemetry category), narrow to LEI and DG."
narrow_if:
  - "A study measures product detection loss by attack replay under instruction-wording counterfactuals."
  - "OpenAI (or another lab) releases a monitoring-evasion eval that uses a frozen detection pipeline plus wording pairs on product telemetry."
