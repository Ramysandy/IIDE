  E2: "instruction wording as cause (ambiguous / scoped / neutral minimal pairs)"
  E3: "attack-replay oracle against a frozen detection pipeline"
  E4: "latent erosion (redundancy lost before a detector goes blind)"
  E5: "disclosure gap and pre-execution ambiguity index (exploratory)"
